<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' ws://localhost:* http://localhost:* ws://127.0.0.1:* http://127.0.0.1:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Familiar</title>
    <link rel="stylesheet" href="./pet.css" />
  </head>
  <body>
    <main class="pet-shell" data-pet-phase="idle" aria-label="Focus Familiar">
      <div
        class="pet"
        id="pet-avatar"
        role="img"
        aria-label="Focus Familiar pet. Drag to move."
      >
        <img id="pet-image" alt="" aria-hidden="true" draggable="false" />
      </div>
      <button
        class="hint"
        id="open-settings"
        type="button"
        aria-label="Open Focus Familiar settings"
        title="Open settings"
      >
        <span id="pet-hint" role="status" aria-live="polite" aria-atomic="true">
          Ready when you are.
        </span>
        <span class="update-badge" aria-hidden="true"></span>
        <span class="hint-action" aria-hidden="true">•••</span>
      </button>
    </main>
    <script type="module" src="./pet.ts"></script>
  </body>
</html>
