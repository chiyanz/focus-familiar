<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' ws://localhost:* http://localhost:* ws://127.0.0.1:* http://127.0.0.1:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Familiar</title>
    <link rel="stylesheet" href="./pet.css" />
  </head>
  <body>
    <main class="pet-shell" data-pet-phase="idle" aria-label="Focus Familiar">
      <button
        class="pet"
        id="open-settings"
        type="button"
        aria-label="Open Focus Familiar settings"
      >
        <img id="pet-image" alt="" aria-hidden="true" draggable="false" />
      </button>
      <p
        class="hint"
        id="pet-hint"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        Ready when you are.
      </p>
    </main>
    <script type="module" src="./pet.ts"></script>
  </body>
</html>
